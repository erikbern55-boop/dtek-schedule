name: Verify fullscreen staging deployment (no production publish)
on:
  pull_request:
    paths:
      - 'docs/fullscreen-sync.js'
      - 'src/media.js'
      - 'src/card-v3.js'
      - '.github/workflows/pages.yml'
      - 'scripts/canonical-v3-generator.mjs'
      - '.github/workflows/fullscreen-staging-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate script syntax and staging page assembly
        run: |
          node --check docs/fullscreen-sync.js
          node --check src/card-v3.js
          node --check src/media.js
          node --check scripts/canonical-v3-generator.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const media=fs.readFileSync('src/media.js','utf8');
          const v3=fs.readFileSync('src/card-v3.js','utf8');
          assert.match(media,/renderCardV3Png as renderCardPng/,'Telegram must use V3 renderer');
          assert.match(v3,/export async function renderCardV3Png/);
          assert.match(v3,/buildCardV3Html\(details\)\.replace\("🗓️ "/,'Telegram calendar must use fullscreen calendar markup');
          assert.match(media,/publishCanonicalSchedule/,'Canonical Telegram JSON must remain enabled');
          assert.match(media,/imageNeedsRefresh/,'Image refresh must remain enabled');
          console.log('PASS: Telegram V3 renderer wiring and canonical schedule logic preserved');
          JS
          mkdir -p staging
          printf '<!doctype html><html><body><main id="card">V3</main></body></html>' > staging/index.html
          cp docs/fullscreen-sync.js staging/fullscreen-sync.js
          python3 - <<'PY'
          from pathlib import Path
          page=Path('staging/index.html')
          html=page.read_text()
          assert '</body>' in html
          page.write_text(html.replace('</body>','<script src="./fullscreen-sync.js"></script></body>',1))
          assert 'fullscreen-sync.js' in page.read_text()
          PY
      - name: Test stale/fresh JSON and Telegram fallback behavior
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';
          const script=fs.readFileSync('docs/fullscreen-sync.js','utf8');
          const sample=[{begin:'00:00',end:'11:30',power:true},{begin:'11:30',end:'15:30',power:false},{begin:'15:30',end:'24:00',power:true}];
          const day=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Kyiv'}).format(new Date());
          async function run(payload, canonicalPeriods=sample) {
            const elements=new Map();
            const document={
              body:{appendChild(node){elements.set(node.id,node)}},
              getElementById(id){return elements.get(id)||null},
              addEventListener(){},
              hidden:false,
              createElement(){return {id:'',style:{},innerHTML:'',remove(){elements.delete(this.id)},querySelector(){return {set src(v){this.value=v}}}}}
            };
            const ctx={document,console,Date,Intl,setInterval(){},fetch:async(url)=>({ok:true,json:async()=>url.includes('today.json')?{date:day,generatedAt:new Date().toISOString(),periods:canonicalPeriods}:payload})};
            vm.runInNewContext(script,ctx);
            await new Promise(resolve=>setTimeout(resolve,50));
            return elements.has('telegram-synced-fallback');
          }
          assert.equal(await run({live:true,date:day,generatedAt:new Date().toISOString(),periods:sample}),false,'fresh JSON must keep V3');
          assert.equal(await run({live:true,date:'2000-01-01',generatedAt:new Date().toISOString(),periods:sample}),true,'wrong day must fall back');
          assert.equal(await run({live:true,date:day,generatedAt:'2000-01-01T00:00:00Z',periods:sample}),true,'stale data must fall back');
          assert.equal(await run({live:false,date:day,generatedAt:new Date().toISOString(),periods:sample}),true,'unavailable DTEK must fall back');
          assert.equal(await run({live:true,date:day,generatedAt:new Date().toISOString(),periods:sample},[{begin:'00:00',end:'24:00',power:true}]),true,'mismatched schedule must fall back');
          console.log('Staging freshness/fallback and canonical parity checks passed');
          JS
      - name: Checkout real Telegram artifacts
        uses: actions/checkout@v4
        with:
          ref: artifacts
          path: telegram-artifacts
      - name: Build isolated real-weather canonical snapshot for PR validation
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {loadWeather,weatherForDate} from './src/weather.js';
          const source=JSON.parse(fs.readFileSync('telegram-artifacts/web/today.json','utf8'));
          const date=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Kyiv'}).format(new Date());
          assert.equal(source.date,date,'DTEK canonical date must match Kyiv today');
          const snapshot=await loadWeather({now:new Date(),file:'staging/weather-cache.json'});
          assert.ok(snapshot,'Live Open-Meteo request failed; no synthetic fallback allowed');
          const weather=weatherForDate(snapshot,date);
          assert.ok(weather&&!weather.stale,'Fresh forecast required');
          for(const field of ['currentTemp','todayMin','todayMax','tomorrowMin','tomorrowMax','soilTemp'])
            assert.ok(Number.isFinite(weather[field]),'Missing real weather '+field);
          for(const field of ['sunrise','sunset'])
            assert.match(weather[field],/^\\d{2}:\\d{2}$/,'Missing '+field);
          fs.mkdirSync('staging/canonical',{recursive:true});
          const output={...source,generatedAt:new Date().toISOString(),weather};
          fs.writeFileSync('staging/canonical/today.json',JSON.stringify(output,null,2));
          if(fs.existsSync('telegram-artifacts/web/tomorrow.json'))
            fs.copyFileSync('telegram-artifacts/web/tomorrow.json','staging/canonical/tomorrow.json');
          console.log('REAL WEATHER TEST SNAPSHOT:',date,weather.fetchedAt,weather.currentTemp,weather.todayMin,weather.todayMax,weather.tomorrowMin,weather.tomorrowMax,weather.soilTemp);
          JS
      - name: Check real canonical JSON and all 48 half-hour slots
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const filename='telegram-artifacts/web/today.json';
          assert.ok(fs.existsSync(filename),'Real Telegram today.json not published yet');
          const data=JSON.parse(fs.readFileSync(filename,'utf8'));
          const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Kyiv'}).format(new Date());
          assert.equal(data.date,today,'Canonical JSON date must be today in Kyiv');
          assert.equal(data.group,'1.1');
          assert.ok(Date.now()-Date.parse(data.generatedAt)<12*60000,'Canonical JSON too old');
          const slots=Array(48).fill(null);
          const minutes=t=>Number(t.slice(0,2))*60+Number(t.slice(3));
          for(const p of data.periods){
            const start=minutes(p.begin),end=minutes(p.end);
            assert.ok(start>=0&&end<=1440&&end>start&&start%30===0&&end%30===0);
            assert.equal(typeof p.power,'boolean');
            for(let i=start/30;i<end/30;i++){
              assert.equal(slots[i],null,'Overlapping half-hour slot '+i);
              slots[i]=p.power;
            }
          }
          assert.ok(slots.every(v=>v!==null),'All 48 slots must be covered');
          console.log('REAL TELEGRAM JSON: 48/48 slots verified',data.date,data.generatedAt);
          JS
      - name: Checkout V3 renderer for real canonical integration test
        uses: actions/checkout@v4
        with:
          ref: feature/svitlopuls-v3-independent-generator
          path: v3-renderer
      - name: Checkout V3 reference assets and verifier
        uses: actions/checkout@v4
        with:
          repository: erikbern55-boop/svitlopuls-v3-test
          ref: main
          path: v3-test
      - uses: actions/setup-node@v4
        with:
          node-version-file: v3-renderer/.nvmrc
          cache: npm
          cache-dependency-path: v3-renderer/package-lock.json
      - name: Generate actual V3 card from Telegram today.json and verify
        working-directory: v3-renderer
        env:
          REGION: kr
          GROUP: '1.1'
          CANONICAL_SNAPSHOT_DIR: '../staging/canonical'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          cp ../scripts/canonical-v3-generator.mjs ./live-generator.mjs
          cp ../v3-test/verify-live.mjs ./verify-live.mjs
          cp ../v3-test/svitlopuls_etalon_garlic.png ../v3-test/svitlopuls_etalon_moon.png ./
          node live-generator.mjs
          node verify-live.mjs
          cp ../src/card-v3.js ./src/card-v3.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {renderCardV3Png} from './src/card-v3.js';
          const live=JSON.parse(fs.readFileSync('dist/svitlopuls-live.json','utf8'));
          const canonical=JSON.parse(fs.readFileSync('../staging/canonical/today.json','utf8'));
          const png=await renderCardV3Png({schedule:canonical.periods,date:canonical.date,label:'сьогодні',source:canonical.source,update:canonical.sourceUpdated,weather:live.weather});
          fs.writeFileSync('dist/telegram-v3-preview.png',png);
          const {buildCardV3Html}=await import('./src/card-v3.js');
          // Assert the actual weather-backed PNG, not only a synthetic HTML fixture.
          const actualHtml=buildCardV3Html({schedule:canonical.periods,date:canonical.date,weather:live.weather});
          const actualPage=await (await import('playwright')).chromium.launch({headless:true});
          try {
            const p=await actualPage.newPage({viewport:{width:1404,height:1536},deviceScaleFactor:1});
            await p.setContent(actualHtml,{waitUntil:'load'});
            const min=p.locator('.v3-weather .weather-tomorrow .v3-tomorrow-min strong');
            const max=p.locator('.v3-weather .weather-tomorrow .v3-tomorrow-max strong');
            assert.equal(await min.count(),1,'Actual PNG missing minimum temperature element');
            assert.equal(await max.count(),1,'Actual PNG missing maximum temperature element');
            assert.ok(await min.isVisible()&&await max.isVisible(),'Actual PNG temperatures are hidden');
            const minText=(await min.innerText()).trim(),maxText=(await max.innerText()).trim();
            assert.match(minText,/^-?\d+°C$|^\+\d+°C$/,'Actual minimum is missing');
            assert.match(maxText,/^-?\d+°C$|^\+\d+°C$/,'Actual maximum is missing');
            const panel=p.locator('.v3-weather .weather-tomorrow');
            const before=await panel.screenshot();
            await p.addStyleTag({content:'.v3-tomorrow-min strong,.v3-tomorrow-max strong{visibility:hidden!important}'});
            const after=await panel.screenshot();
            assert.notDeepEqual(before,after,'PNG panel has no visible temperature pixels');
            console.log('PASS actual PNG tomorrow panel:',minText,maxText,'pixel difference verified');
          } finally {await actualPage.close();}
          const fixtureWeather={...live.weather,tomorrowMin:0,tomorrowMax:6,tomorrowDate:'2026-11-16'};
          const fixtureHtml=buildCardV3Html({schedule:canonical.periods,date:canonical.date,weather:fixtureWeather});
          assert.ok(fixtureHtml.includes('class="v3-tomorrow-min"'),'Minimum container missing');
          assert.ok(fixtureHtml.includes('class="v3-tomorrow-max"'),'Maximum container missing');
          const {chromium}=await import('playwright');
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({viewport:{width:1404,height:1536}});
            await page.setContent(fixtureHtml);
            for(const selector of ['.v3-tomorrow-min strong','.v3-tomorrow-max strong']){
              const locator=page.locator(selector);
              assert.equal(await locator.count(),1,'Temperature element must exist: '+selector);
              assert.equal(await locator.isVisible(),true,'Temperature must be visible in card: '+selector);
              const rect=await locator.boundingBox();
              assert.ok(rect&&rect.width>0&&rect.height>0,'Temperature must occupy pixels: '+selector);
            }
            assert.equal(await page.locator('.v3-tomorrow-min strong').innerText(),'0°C');
            assert.equal(await page.locator('.v3-tomorrow-max strong').innerText(),'+6°C');
            await page.screenshot({path:'dist/tomorrow-panel-verified.png',fullPage:true});
            console.log('PASS V3 tomorrow minimum/maximum: DOM text, visibility and screenshot');
          } finally { await browser.close(); }
          assert.ok(png.length>10000,'Telegram V3 PNG unexpectedly small');
          console.log('PASS Telegram V3 PNG render from canonical schedule',png.length);
          JS
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const canonical=JSON.parse(fs.readFileSync('../staging/canonical/today.json'));
          const generated=JSON.parse(fs.readFileSync('dist/svitlopuls-live.json'));
          assert.equal(generated.date,canonical.date);
          assert.equal(generated.group,canonical.group);
          assert.deepEqual(generated.periods,canonical.periods,'Every V3 interval must match Telegram');
          const audit=JSON.parse(fs.readFileSync('dist/dtek-interval-audit.json'));
          console.log('REAL V3-TELEGRAM PARITY PASS',canonical.date,JSON.stringify(audit.days?.today||audit).slice(0,800));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: fullscreen-staging-site
          path: |
            staging/
            v3-renderer/dist/telegram-v3-preview.png
            v3-renderer/dist/today.png
