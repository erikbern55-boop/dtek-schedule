name: V3 live JSON isolated test
on:
  workflow_dispatch:
  push:
    branches:
      - feature/svitlopuls-v3-independent-generator
    paths:
      - 'src/card-v3-live-json.js'
      - 'src/media.js'
      - 'scripts/v3-live-test.mjs'
      - 'scripts/v3-live-browser-check.mjs'
      - 'test/card-v3-live-json.test.js'
      - 'test/card-v3-live-sources.test.js'
      - '.github/workflows/v3-live-json-test.yml'
jobs:
  live-json:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REGION: kr
      GROUP: "1.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --check src/media.js && node --test test/card-v3-live-json.test.js
      - name: Fetch real DTEK and compare JSON schedule
        run: node scripts/v3-live-test.mjs
      - name: Verify all live JSON periods in Chromium HTML
        run: node scripts/v3-live-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svitlopuls-v3-live-json-test
          path: |
            artifacts/web/svitlopuls-live.json
            artifacts/web/v3-live-check.html
            artifacts/web/v3-live-browser.png
            artifacts/web/v3-live-browser-report.json
          if-no-files-found: warn
