name: TEST diagnose production schedule runs (read-only)

on:
  push:
    branches: [test/guide-json-parity-20261115]
    paths: ['.github/workflows/test-schedule-diagnostics.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect last production generator and Pages runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,datetime
          now=datetime.datetime.now(datetime.timezone.utc)
          report={'checkedAt':now.isoformat(),'workflows':{},'errors':[]}
          for name in ('schedule.yml','pages.yml'):
              proc=subprocess.run(['gh','api','--method','GET',f'repos/{os.environ["GH_REPO"]}/actions/workflows/{name}/runs','-f','per_page=10'],capture_output=True,text=True)
              if proc.returncode:
                  report['errors'].append(name+': '+proc.stderr.strip());continue
              data=json.loads(proc.stdout)
              report['workflows'][name]=[{'id':r['id'],'event':r['event'],'status':r['status'],'conclusion':r['conclusion'],'created_at':r['created_at'],'updated_at':r['updated_at'],'head_branch':r['head_branch'],'html_url':r['html_url']} for r in data.get('workflow_runs',[])]
          with open('schedule-diagnostics.json','w') as f:json.dump(report,f,ensure_ascii=False,indent=2)
          summary=['## Production generator diagnostics (read-only)','',f'Checked: {now.isoformat()}','']
          for name,runs in report['workflows'].items():
              summary.extend([f'### {name}','','| Created UTC | Event | Status | Conclusion | Run |','|---|---|---|---|---|'])
              for r in runs:summary.append(f'| {r["created_at"]} | {r["event"]} | {r["status"]} | {r["conclusion"]} | [#{r["id"]}]({r["html_url"]}) |')
              summary.append('')
          summary.extend(report['errors'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(summary)+'\n')
          if report['errors']:raise SystemExit(1)
          PY
      - name: Upload diagnostics report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svitlopuls-production-schedule-diagnostics
          path: schedule-diagnostics.json
          if-no-files-found: ignore
          retention-days: 7
