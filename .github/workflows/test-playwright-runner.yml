name: TEST Playwright on Ubuntu 24.04 (no publishing)

on:
  push:
    branches: [test/guide-json-parity-20261115]
    paths:
      - '.github/workflows/test-playwright-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Check schedule and run tests without generating or publishing
        run: |
          node --check ./src/schedule.js
          node --test
