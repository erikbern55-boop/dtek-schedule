name: Publish Svitlopuls fullscreen viewer

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/fullscreen-sync.js'
      - 'scripts/canonical-v3-generator.mjs'
      - 'guide/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ["Run power outages schedule generator"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: svitlopuls-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published viewer
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - name: Checkout current snapshots
        uses: actions/checkout@v4
        with:
          ref: artifacts
          path: snapshots
          fetch-depth: 1
      - name: Checkout approved V3 generator and reference images
        uses: actions/checkout@v4
        with:
          repository: erikbern55-boop/svitlopuls-v3-test
          ref: main
          path: v3-test
          persist-credentials: false
      - name: Checkout tested V3 renderer
        uses: actions/checkout@v4
        with:
          repository: erikbern55-boop/dtek-schedule
          ref: feature/svitlopuls-v3-independent-generator
          path: v3-renderer
          persist-credentials: false
      - name: Set up Node.js for V3
        uses: actions/setup-node@v4
        with:
          node-version-file: v3-renderer/.nvmrc
          cache: npm
          cache-dependency-path: v3-renderer/package-lock.json
      - name: Install V3 dependencies
        working-directory: v3-renderer
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Restore last validated weather forecast
        uses: actions/cache/restore@v4
        with:
          path: v3-renderer/artifacts/weather-cache.json
          key: svitlopuls-production-weather-${{ github.run_id }}
          restore-keys: |
            svitlopuls-production-weather-
      - name: Generate and validate live V3 page without Telegram messages
        working-directory: v3-renderer
        env:
          REGION: kr
          GROUP: '1.1'
          PRODUCTION_VIEWER: '1'
          CANONICAL_SNAPSHOT_DIR: '../snapshots/web'
        run: |
          cp ../source/scripts/canonical-v3-generator.mjs ./live-generator.mjs
          cp ../v3-test/verify-live.mjs ./verify-live.mjs
          cp ../v3-test/svitlopuls_etalon_garlic.png ../v3-test/svitlopuls_etalon_moon.png ./
          node live-generator.mjs
          node verify-live.mjs
      - name: Save validated weather forecast
        if: success()
        uses: actions/cache/save@v4
        with:
          path: v3-renderer/artifacts/weather-cache.json
          key: svitlopuls-production-weather-${{ github.run_id }}
      - name: Prepare public site
        run: |
          mkdir -p site
          mkdir -p site/guide
          for section in weather garden moon astro lifehacks cinema church-calendar; do
            cp -R "source/guide/$section" "site/guide/$section"
            test -s "site/guide/$section/index.html"
          done
          cp v3-renderer/dist/index.html site/index.html
          cp source/docs/fullscreen-sync.js site/fullscreen-sync.js
          python3 - <<'PY'
          from pathlib import Path
          page = Path('site/index.html')
          html = page.read_text()
          assert '</body>' in html, 'Missing V3 body closing tag'
          html = html.replace('</body>', '<script src="./fullscreen-sync.js"></script></body>', 1)
          page.write_text(html)
          PY
          cp v3-renderer/dist/svitlopuls-live.json site/svitlopuls-live.json
          cp v3-renderer/dist/svitlopuls_etalon_garlic.png site/
          cp v3-renderer/dist/svitlopuls_etalon_moon.png site/
          # Keep the existing Telegram-compatible snapshots and URLs intact.
          test -s snapshots/web/today.png
          test -s snapshots/web/today.json
          cp snapshots/web/today.json site/today.json
          cp snapshots/web/today.png site/today.png
          if [ -s snapshots/web/today.html ]; then cp snapshots/web/today.html site/today.html; fi
          if [ -s snapshots/web/tomorrow.png ]; then cp snapshots/web/tomorrow.png site/tomorrow.png; fi
          if [ -s snapshots/web/tomorrow.html ]; then cp snapshots/web/tomorrow.html site/tomorrow.html; fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
