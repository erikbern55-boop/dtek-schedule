name: Publish Svitlopuls fullscreen viewer

on:
  workflow_run:
    workflows: ["Run power outages schedule generator"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: svitlopuls-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published viewer
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - name: Checkout current snapshots
        uses: actions/checkout@v4
        with:
          ref: artifacts
          path: snapshots
      - name: Prepare public site
        run: |
          mkdir -p site
          cp source/docs/index.html site/index.html
          test -f snapshots/web/today.png
          cp snapshots/web/today.png site/today.png
          if [ -f snapshots/web/tomorrow.png ]; then cp snapshots/web/tomorrow.png site/tomorrow.png; fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
