<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020e08">
<title>Світлопульс 3.0 · СТ «Хімік»</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#020e08}
body{display:flex;justify-content:center;align-items:flex-start}
main{width:100%;max-width:1200px;margin:0 auto}
img{display:block;width:100%;height:auto;object-fit:contain}
</style>
</head>
<body>
<main><img id="card" alt="Світлопульс 3.0: графік електропостачання, погода та календар"></main>
<script>
const day=new URLSearchParams(location.search).get('day')==='tomorrow'?'tomorrow':'today';
const card=document.getElementById('card');
let previousObjectUrl=null;
let requestNumber=0;
async function refresh(){
  const request=++requestNumber;
  try{
    const response=await fetch('./'+day+'.png?refresh='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const url=URL.createObjectURL(await response.blob());
    if(request!==requestNumber){URL.revokeObjectURL(url);return;}
    const old=previousObjectUrl;
    previousObjectUrl=url;
    card.onload=()=>{if(old)URL.revokeObjectURL(old);};
    card.src=url;
  }catch(error){console.warn('Fullscreen card refresh failed',error);}
}
refresh();
setInterval(refresh,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
</script>
</body>
</html>
