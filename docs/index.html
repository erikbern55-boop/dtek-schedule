<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#041b12">
<title>Світлопульс 2.3 · Повний екран</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#03150e;color:#ecfff1;font-family:system-ui,Arial,sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px max(12px,env(safe-area-inset-right));background:#08251a}
strong{color:#9affb2}nav{display:flex;gap:8px}button{border:1px solid #4bd984;background:#113b29;color:white;border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#2c8650}
main{flex:1;min-height:0;display:grid;place-items:center;padding:8px;overflow:hidden;width:100%}
#landscapeCard{display:none;max-width:100%;max-height:100%;object-fit:contain}
img{display:block;max-width:100%;max-height:calc(100dvh - 104px);object-fit:contain}
#status{font-size:14px;text-align:center;color:#b8d8c4;padding:6px}
@media(orientation:landscape){header{padding-block:3px}button{padding:5px 9px}main{padding:2px}#card{display:none}#landscapeCard{display:block;max-height:calc(100dvh - 63px)}#status{padding:2px;font-size:12px}}
body.immersive header{position:fixed;top:0;right:0;z-index:10;background:transparent;padding:4px}body.immersive header strong,body.immersive header #today,body.immersive header #tomorrow,body.immersive #status{display:none}body.immersive #full{font-size:13px;opacity:.7;padding:5px 8px}body.immersive main{height:100dvh;flex:1;padding:0}body.immersive #landscapeCard{max-height:100dvh}body.immersive #card{max-height:100dvh}
:fullscreen,:fullscreen body{background:#03150e}
</style></head><body>
<header><strong>⚡ СВІТЛОПУЛЬС 2.3</strong><nav><button id="today" aria-pressed="true">Сьогодні</button><button id="tomorrow" aria-pressed="false">Завтра</button><button id="full">⛶ На весь екран</button></nav></header>
<main><img id="card" alt="Актуальна картка Світлопульсу"><canvas id="landscapeCard" role="img" aria-label="Картка Світлопульсу, розташована у двох колонках для горизонтального екрана"></canvas></main>
<div id="status" role="status">Поверни телефон горизонтально для ширшого перегляду</div>
<script>
const card=document.getElementById('card'),status=document.getElementById('status');
let day=new URLSearchParams(location.search).get('day')==='tomorrow'?'tomorrow':'today';
const landscapeCard=document.getElementById('landscapeCard');
function renderLandscape(){
  if(!card.complete||!card.naturalWidth)return;
  const w=card.naturalWidth,h=card.naturalHeight;
  // The approved card has a natural section boundary between outage information
  // and weather/gardening panels at approximately 45% of its height.
  const split=Math.round(h*0.45),bottom=h-split;
  // Two consecutive sections at the outage/weather boundary; no Telegram changes.
  const ctx=landscapeCard.getContext('2d');
  landscapeCard.width=w*2;landscapeCard.height=Math.max(split,bottom);
  ctx.clearRect(0,0,landscapeCard.width,landscapeCard.height);
  ctx.drawImage(card,0,0,w,split,0,0,w,split);
  if(bottom>0)ctx.drawImage(card,0,split,w,bottom,w,0,w,bottom);
  // Each section retains its original pixel scale and aspect ratio.
  landscapeCard.style.aspectRatio=(w*2)+' / '+landscapeCard.height;
}
window.addEventListener('resize',renderLandscape);
function select(next){day=next;document.getElementById('today').setAttribute('aria-pressed',String(day==='today'));document.getElementById('tomorrow').setAttribute('aria-pressed',String(day==='tomorrow'));load();}
function load(){card.alt='Картка Світлопульсу: '+(day==='today'?'сьогодні':'завтра');card.src='./'+day+'.png?t='+Math.floor(Date.now()/300000);}
card.addEventListener('error',()=>{status.textContent='Картка ще не опублікована. Перевір налаштування публікації.';});
card.addEventListener('load',()=>{renderLandscape();status.textContent='У горизонтальному режимі картка показана у двох колонках';});
document.getElementById('today').onclick=()=>select('today');
document.getElementById('tomorrow').onclick=()=>select('tomorrow');
const fullButton=document.getElementById('full');
function setImmersive(on){document.body.classList.toggle('immersive',on);fullButton.textContent=on?'✕ Вийти':'⛶ На весь екран';requestAnimationFrame(renderLandscape);}
fullButton.onclick=async()=>{if(document.body.classList.contains('immersive')){setImmersive(false);if(document.fullscreenElement)try{await document.exitFullscreen()}catch{}return;}setImmersive(true);try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch{/* Telegram and mobile browsers may reject fullscreen; immersive CSS still works. */}};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('immersive')){requestAnimationFrame(renderLandscape);}});
setInterval(load,300000);select(day);
</script></body></html>
